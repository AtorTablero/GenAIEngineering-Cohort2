<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative AI Masterclass</title>
    <link rel="stylesheet" href="css/claudeai.css">
</head>
<body>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="animated-bg" aria-hidden="true"></div>
    <canvas id="neuralCanvas" class="neural-canvas" aria-hidden="true"></canvas>
    <canvas id="glCanvas" class="neural-canvas gl-canvas" aria-hidden="true"></canvas>
    <div class="floating-orb orb1" aria-hidden="true"></div>
    <div class="floating-orb orb2" aria-hidden="true"></div>
    <div class="floating-orb orb3" aria-hidden="true"></div>

    <nav>
        <div class="logo">✨ GenAI</div>
        <ul class="nav-links">
            <li><a href="#features">Features</a></li>
            <li><a href="#curriculum">Curriculum</a></li>
            <li><a href="#testimonials">Testimonials</a></li>
        </ul>
        <div style="display:flex; gap:0.6rem; align-items:center;">
            <button class="ghost-btn" id="previewBtn">Preview</button>
            <button class="primary-cta" id="openEnroll">Enroll</button>
        </div>
    </nav>

    <!-- Control panel for background tuning -->
    <div id="bgControls" style="position:fixed; right:1rem; top:5.5rem; z-index:260; display:flex; flex-direction:column; gap:0.6rem; background:rgba(6,8,20,0.5); padding:0.6rem; border-radius:8px; border:1px solid rgba(255,255,255,0.04); backdrop-filter:blur(6px);">
        <label style="font-size:0.85rem; color:rgba(255,255,255,0.85);">Palette
            <select id="paletteSelect" style="margin-left:0.4rem;">
                <option value="cool">Cool Blues</option>
                <option value="warm">Warm Magenta</option>
                <option value="neon">Neon Mix</option>
            </select>
        </label>
        <label style="font-size:0.85rem; color:rgba(255,255,255,0.85);">Intensity
            <input id="intensityRange" type="range" min="0.3" max="1.8" step="0.05" value="1" style="width:120px; margin-left:0.4rem; vertical-align:middle;" />
            <span id="intensityVal" style="margin-left:0.5rem; font-weight:700;">1.00</span>
        </label>
        <label style="font-size:0.85rem; color:rgba(255,255,255,0.85);"><input id="hoverToggle" type="checkbox" checked /> Hover effects</label>
        <label style="font-size:0.85rem; color:rgba(255,255,255,0.85);"><input id="gpuToggle" type="checkbox" /> GPU mode</label>
        <div style="display:flex; flex-direction:column; gap:6px;">
            <div id="gpuStatus" style="font-size:0.8rem; color:#bfe9ff; margin-top:4px;">GPU: detecting…</div>
            <div style="display:flex; gap:6px;">
                <button id="disableGpuBtn" class="ghost-btn" style="font-size:0.75rem;">Disable GPU</button>
                <button id="lowPowerBtn" class="ghost-btn" style="font-size:0.75rem;">Low-power</button>
            </div>
            <button id="captureBtn" class="ghost-btn" style="margin-top:6px; font-size:0.85rem;">Capture</button>
        </div>
    </div>
    <div id="nodeTooltip" style="position:fixed; pointer-events:none; padding:6px 8px; background:rgba(10,12,30,0.9); color:#cfe9ff; border-radius:6px; font-size:0.85rem; display:none; z-index:270; border:1px solid rgba(255,255,255,0.03);"></div>

    <script src="js/claudeai.js"></script>
</body>
</html>
